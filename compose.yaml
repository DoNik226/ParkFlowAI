services:


  detector:
    build:
      context: .
      dockerfile: detector/Dockerfile
    image: parkflowai-detector
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./back:/app/back
    depends_on:
      - backend
    restart: unless-stopped  
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parking_db
      POSTGRES_USER: parkflow
      POSTGRES_PASSWORD: parkflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkflow -d parking_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: back/Dockerfile
    environment:
      DATABASE_URL: postgresql://parkflow:parkflow@db:5432/parking_db
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: parking_db
      DB_USER: parkflow
      DB_PASSWORD: parkflow
      SECRET_KEY: change-me-in-production
      ALGORITHM: HS256
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_EMAIL: admin@example.com
      INITIAL_ADMIN_PASSWORD: adminadminadmin
      INITIAL_ADMIN_FULL_NAME: ParkFlow Admin
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy

  detector-parking-a:
    build:
      context: .
      dockerfile: back/Dockerfile.detector
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: >
      python -m back.app.services.run_parking_stream
      --parking-id parking_a
      --layout /app/data/parkings/parking_a/layout.json
      --source /app/data/parkings/parking_a/test_video.mp4
      --model /app/models/best.pt
      --interval-sec 2
      --conf 0.20
      --imgsz 640
      --save-json /app/data/parkings/parking_a/occupancy.json
      --save-frame /app/data/parkings/parking_a/debug_detection.jpg
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: