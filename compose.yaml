services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parking_db
      POSTGRES_USER: parkflow
      POSTGRES_PASSWORD: parkflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkflow -d parking_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: back/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: parking_db
      DB_USER: parkflow
      DB_PASSWORD: parkflow
      DATABASE_URL: postgresql://parkflow:parkflow@db:5432/parking_db
      SECRET_KEY: change-me-in-production
      ALGORITHM: HS256
      INITIAL_ADMIN_EMAIL: admin@example.com
      INITIAL_ADMIN_FULL_NAME: ParkFlow Admin
      INITIAL_ADMIN_PASSWORD: adminadminadmin
      INITIAL_ADMIN_USERNAME: admin
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  detector:
    image: parkflowai-detector
    build:
      context: .
      dockerfile: detector/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: parking_db
      DB_USER: parkflow
      DB_PASSWORD: parkflow
      DATABASE_URL: postgresql://parkflow:parkflow@db:5432/parking_db
      SECRET_KEY: change-me-in-production
      ALGORITHM: HS256
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./back:/app/back

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  postgres_data: