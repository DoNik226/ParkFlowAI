services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parking_db
      POSTGRES_USER: parkflow
      POSTGRES_PASSWORD: parkflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkflow -d parking_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: back/Dockerfile
    environment:
      DATABASE_URL: postgresql://parkflow:parkflow@db:5432/parking_db
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: parking_db
      DB_USER: parkflow
      DB_PASSWORD: parkflow
      SECRET_KEY: change-me-in-production
      ALGORITHM: HS256
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_EMAIL: admin@example.com
      INITIAL_ADMIN_PASSWORD: adminadminadmin
      INITIAL_ADMIN_FULL_NAME: ParkFlow Admin
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
